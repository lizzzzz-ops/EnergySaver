<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EnergySaver - Login</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f2027, #2ecc71);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            width: 100%;
            max-width: 370px;
            text-align: center;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.2);
            animation: fadeIn 0.8s ease-in-out;
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .logo {
            width: 120px;
            margin-bottom: 10px;
        }

        h1 {
            font-weight: bold;
            font-size: 28px;
            margin: 5px 0;
        }

        .energy { color: #1b5e20; font-weight: bold; }
        .saver { color: #4caf50; font-weight: bold; }

        .sub {
            font-weight: bold;
            color: #555;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 14px;
            box-sizing: border-box;
        }

        input:focus {
            border-color: #2ecc71;
            outline: none;
        }

        .password-container {
            position: relative;
        }

        .toggle-btn {
            position: absolute;
            right: 12px;
            top: 20px;
            cursor: pointer;
            user-select: none;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #2ecc71;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: .3s;
        }

        button:hover {
            background: #27ae60;
            transform: scale(1.02);
        }

        .btn-admin-demo {
            background: #1a5b3e;
            margin-top: 8px;
            font-size: 14px;
        }

        .btn-admin-demo:hover {
            background: #0f4c2f;
        }

        .error {
            color: #e74c3c;
            margin-top: 12px;
            font-size: 14px;
            font-weight: bold;
            display: none;
        }

        .footer {
            margin-top: 18px;
            font-size: 13px;
            color: #555;
        }

        .footer a {
            color: #2ecc71;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- LOGO REAL DE TU REPO -->
        <img src="../wwwroot/imagenes/logo1.png" alt="Logo EnergySaver" class="logo" onerror="this.style.display='none'" />

        <h1>
            <span class="energy">Energy</span><span class="saver">Saver</span>
        </h1>

        <p class="sub">Control inteligente de energía</p>

        <form id="loginForm">
            <input type="email" id="correo" placeholder="Correo electrónico (ej. admin@energysaver.com)" required />

            <div class="password-container">
                <input type="password" id="password" placeholder="Contraseña" required />
                <span class="toggle-btn" onclick="togglePassword()">👁️</span>
            </div>

            <button type="submit">Ingresar como Usuario</button>
            <button type="button" class="btn-admin-demo" onclick="window.location.href='admin.html'">
                🛡️ Entrar a Panel Administrador
            </button>
        </form>

        <p class="error" id="errorMsg">Por favor completa correo y contraseña válidos.</p>

        <div class="footer">
            Acceso rápido directo:
            <a href="usuario.html">Vista Usuario</a> ·
            <a href="admin.html">Vista Admin</a>
        </div>
    </div>

    <script>
        function togglePassword() {
            var x = document.getElementById("password");
            x.type = x.type === "password" ? "text" : "password";
        }

        document.getElementById("loginForm").addEventListener("submit", function (e) {
            e.preventDefault();
            const correo = document.getElementById("correo").value.trim();
            const pass = document.getElementById("password").value.trim();
            if (!correo || pass.length < 3) {
                document.getElementById("errorMsg").style.display = "block";
                return;
            }
            if (correo.toLowerCase().includes("admin")) {
                window.location.href = "admin.html";
            } else {
                window.location.href = "usuario.html";
            }
        });
    </script>
</body>
</html>
